<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date and Time Functions</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Toastify CSS CDN -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        /* Custom background color to match the light greenish/grey hue */
        body {
            background-color: #f1f6f4;
        }
    </style>
</head>

<body class="min-h-screen text-gray-800 font-sans">

    <div class="max-w-6xl mx-auto px-4 py-6 md:px-8 md:py-10">

        <!-- Header Section -->
        <h1 class="text-lg md:text-2xl font-medium text-center mb-4 md:mb-6 text-gray-900 leading-snug">
            Chapter # 31 - 38 | Date and Time, Functions: Passing them data and get data from them
        </h1>
        <hr class="border-t-2 border-gray-300 mb-8 md:mb-10 w-full">

        <!-- Main Layout Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-10 gap-y-8 md:gap-y-10">

            <!-- Top Left: Input -->
            <div class="flex flex-col">
                <h2 class="text-lg md:text-xl text-center mb-2 text-gray-800">Input</h2>
                <div class="border border-gray-400 rounded-md p-4 h-full flex items-center bg-transparent">
                    <div class="flex flex-row w-full gap-2 md:gap-3">
                        <div
                            class="flex-1 border border-gray-300 bg-white rounded-md flex items-center px-3 py-2 shadow-sm">
                            <input type="datetime-local"
                                class="flex-1 w-full outline-none text-gray-500 bg-transparent text-xs md:text-sm"
                                id="input">
                            <!-- Calendar Icon -->
                            <svg class="w-5 h-5 text-gray-600 flex-shrink-0" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                                </path>
                            </svg>
                        </div>
                        <button onclick="clearIn()" id="clear-input-btn"
                            class="border border-gray-300 rounded-md px-3 md:px-5 py-2 text-gray-500 bg-white hover:bg-gray-50 transition shadow-sm text-sm">Clear</button>
                    </div>
                </div>
            </div>

            <!-- Top Right: Current Date and Time -->
            <div class="flex flex-col">
                <h2 class="text-lg md:text-xl text-center mb-2 text-gray-800">Current Date and Time</h2>
                <div class="bg-[#1e3049] text-gray-200 rounded-md p-4 md:p-6 h-full flex items-center gap-3 shadow-md">
                    <svg class="w-4 h-4 text-white fill-current flex-shrink-0" viewBox="0 0 24 24">
                        <path d="M5 3l14 9-14 9V3z" />
                    </svg>
                    <!-- current date -->
                    <p class="text-xs md:text-sm tracking-wide leading-relaxed" id="tdate"></p>
                </div>
            </div>

            <!-- Bottom Left: Buttons -->
            <div class="flex flex-col">
                <h2 class="text-lg md:text-xl text-center mb-2 text-gray-800">Buttons</h2>
                <div class="border border-gray-400 rounded-md p-3 md:p-4 bg-transparent">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <!-- Get Name of Today -->
                        <button
                            class="action-btn bg-[#ef4444] hover:bg-red-600 text-white rounded-sm py-2.5 px-2 text-xs md:text-sm transition shadow-sm break-words"
                            onclick="today()">Get Name of Today</button>
                        <!-- Calculate Days Passed since I born -->
                        <button
                            class="action-btn bg-[#ef4444] hover:bg-red-600 text-white rounded-sm py-2.5 px-2 text-xs md:text-sm transition shadow-sm break-words"
                            onclick="dayPassed()">Calculate Days Passed since I born</button>
                             <!-- next Birthday -->
                        <button onclick="nextBirth()"
                            class="action-btn bg-[#ef4444] hover:bg-red-600 text-white rounded-sm py-2.5 px-2 text-xs md:text-sm transition shadow-sm break-words">When
                            is your next Birthday?</button>
                        <button onclick="greeting()"
                            class="action-btn bg-[#ef4444] hover:bg-red-600 text-white rounded-sm py-2.5 px-2 text-xs md:text-sm transition shadow-sm break-words">Greet
                            User</button>

                        <button onclick="tellTime1()"
                            class="action-btn bg-[#ef4444] hover:bg-red-600 text-white rounded-sm py-2.5 px-2 text-xs md:text-sm transition shadow-sm break-words">Tell
                            Time 1</button>
                        <button onclick="tellTime2()"
                            class="action-btn bg-[#ef4444] hover:bg-red-600 text-white rounded-sm py-2.5 px-2 text-xs md:text-sm transition shadow-sm break-words">Tell
                            Time 2</button>

                        <button onclick="tellTime3()"
                            class="action-btn bg-[#ef4444] hover:bg-red-600 text-white rounded-sm py-2.5 px-2 text-xs md:text-sm transition shadow-sm break-words">Tell
                            Time 3</button>
                        <button onclick="tax()"
                            class="action-btn bg-[#ef4444] hover:bg-red-600 text-white rounded-sm py-2.5 px-2 text-xs md:text-sm transition shadow-sm break-words">Calculate
                            Tax</button>
                    </div>
                    <!-- Centered bottom button -->
                    <div class="mt-2 flex justify-center">
                        <button onclick="taxAmount()"
                            class="action-btn bg-[#ef4444] hover:bg-red-600 text-white rounded-sm py-2.5 px-4 w-full sm:w-[70%] text-xs md:text-sm transition shadow-sm break-words">Calculate
                            Total = Price + Tax</button>
                    </div>
                </div>
            </div>

            <!-- Bottom Right: Output / Result -->
            <div class="flex flex-col">
                <h2 class="text-lg md:text-xl text-center mb-2 text-gray-800">Output / Result</h2>
                <div class="border border-gray-400 rounded-md bg-transparent flex-1 min-h-[12rem] md:min-h-[16rem] flex items-center justify-center p-4 text-center"
                    id="output">
                    <!-- Output content will go here -->
                </div>
                <div class="flex justify-center mt-4">
                    <button onclick="clearOut()" id="clear-output-btn"
                        class="border border-gray-400 text-gray-600 bg-white hover:bg-gray-50 rounded-md px-4 py-1.5 text-sm transition shadow-sm w-auto">Clear
                        Output</button>
                </div>
            </div>

        </div>
    </div>

    <div class="bg-[#123] text-white text-center p-2" id="copyrightYear">
    </div>

    <!-- Toastify JS CDN -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- custom js  -->
    <script src="script.js"></script>
</body>

</html>
